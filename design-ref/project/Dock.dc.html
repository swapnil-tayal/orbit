<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400;500&amp;family=Unbounded:wght@400..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 420px; height: 88px; display: flex; align-items: center; justify-content: center; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #F4F2FF">
<nav aria-label="World controls" style="display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(20,18,44,0.8); border: 1px solid rgba(190,180,255,0.18); box-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,61,154,0.08), inset 0 1px 0 rgba(255,255,255,0.06); backdrop-filter: blur(18px) saturate(160%)">
<sc-if value="{{isSpace}}" hint-placeholder-val="{{false}}">
<button aria-label="Back to globe" style="width: 60px; height: 56px; border: 0; border-radius: 999px; background: {{bgGlobe}}; color: #22E3FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10px/13px 'Geist', system-ui, sans-serif; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3.5 9h17M3.5 15h17M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"></path></svg>
<span style="color: #BDB8E6">Globe</span>
</button>
</sc-if>
<button aria-label="Go home" style="width: 60px; height: 56px; border: 0; border-radius: 999px; background: {{bgHome}}; color: #FFD23F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10px/13px 'Geist', system-ui, sans-serif; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"></path></svg>
<span style="color: #BDB8E6">Home</span>
</button>
<button aria-label="People" style="width: 60px; height: 56px; border: 0; border-radius: 999px; background: {{bgPeople}}; color: #B6FF3B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10px/13px 'Geist', system-ui, sans-serif; cursor: pointer; position: relative">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.8 20c0-3.3 2.8-5.6 6.2-5.6s6.2 2.3 6.2 5.6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M16 14.6c3 0 5.2 1.9 5.2 4.6"></path></svg>
<span style="color: #BDB8E6">People</span>
<span style="position: absolute; top: 4px; right: 8px; min-width: 18px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #B6FF3B; color: #0B0B1A; font: 700 10px/16px 'Geist Mono', ui-monospace, monospace; text-align: center; box-shadow: 0 0 10px rgba(182,255,59,0.6)">{{online}}</span>
</button>
<sc-if value="{{isSpace}}" hint-placeholder-val="{{false}}">
<button aria-label="{{micLabel}}" style="width: 60px; height: 56px; border: 0; border-radius: 999px; background: {{micBg}}; color: {{micColor}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10px/13px 'Geist', system-ui, sans-serif; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path><path d="M4 4l16 16" opacity="{{micSlash}}"></path></svg>
<span style="color: {{micText}}">{{micText2}}</span>
</button>
</sc-if>
<span aria-hidden="true" style="width: 1px; height: 28px; background: rgba(190,180,255,0.16); margin: 0 4px"></span>
<button aria-label="Your profile" style="width: 60px; height: 56px; border: 0; border-radius: 999px; background: {{bgYou}}; color: #F4F2FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 10px/13px 'Geist', system-ui, sans-serif; cursor: pointer">
<dc-import name="Avatar" mode="bust" size="24" presence="online" you="true" skin="#C68A62" hair="short" hair-color="#17120F" outfit="#FF3D9A" hint-size="24px,24px"></dc-import>
<span style="color: #BDB8E6">You</span>
</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"context":{"editor":"enum","options":["globe","space"],"default":"globe"},"active":{"editor":"enum","options":["none","home","people","you","globe"],"default":"none"},"mic":{"editor":"enum","options":["on","off"],"default":"on"},"online":{"editor":"int","default":21},"$preview":{"width":420,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props; const a = p.active ?? 'none';
    const on = (k) => a === k ? 'rgba(190,180,255,0.14)' : 'transparent';
    const micOn = (p.mic ?? 'on') === 'on';
    return {
      isSpace: (p.context ?? 'globe') === 'space', online: p.online ?? 21,
      bgHome: on('home'), bgPeople: on('people'), bgYou: on('you'), bgGlobe: on('globe'),
      micBg: micOn ? 'rgba(182,255,59,0.14)' : 'rgba(190,180,255,0.06)', micColor: micOn ? '#B6FF3B' : '#BDB8E6',
      micSlash: micOn ? 0 : 1, micText: micOn ? '#B6FF3B' : '#BDB8E6', micText2: micOn ? 'Mic on' : 'Muted', micLabel: micOn ? 'Mute microphone' : 'Unmute microphone'
    };
  }
}
</script>
</body>
</html>
